<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" fill="none" stroke="#1C1C1C" stroke-linecap="round">
  <style>
    .ster{fill:#1C1C1C;transform-box:fill-box;transform-origin:center;animation:twinkel 5s ease-in-out infinite}
    @keyframes twinkel{0%,100%{opacity:.15;transform:scale(.5) rotate(0)}50%{opacity:1;transform:scale(1) rotate(45deg)}}
    .zwaai{transform-box:fill-box;transform-origin:center;animation:zwaai 9s ease-in-out infinite}
    @keyframes zwaai{0%,100%{transform:rotate(-10deg)}30%{transform:rotate(14deg)}60%{transform:rotate(-4deg)}80%{transform:rotate(6deg)}}
    .meridiaan{animation:draai 36s linear infinite}@keyframes draai{0%{rx:0px}8.3%{rx:113.9px}16.7%{rx:220px}25%{rx:311.1px}33.3%{rx:381.1px}41.7%{rx:425px}50%{rx:440px}58.3%{rx:425px}66.7%{rx:381.1px}75%{rx:311.1px}83.3%{rx:220px}91.7%{rx:113.9px}100%{rx:0px}}
    .route{animation:reis 7s linear infinite}@keyframes reis{to{stroke-dashoffset:-90}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <ellipse cx="500" cy="280" rx="440" ry="220" stroke-width="1.6"/>
